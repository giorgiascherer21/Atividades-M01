<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercício do Alien</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>

<style>

/* Centraliza o jogo na tela */
body{
 margin:0;
 padding:0;
 width:100vw;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#000;
 overflow:hidden;
}

/* Container do jogo */
#game-container{
 display:flex;
 justify-content:center;
 align-items:center;
 width:100%;
 height:100%;
}

/* Canvas responsivo */
canvas{
 max-width:100%;
 height:auto;
}

</style>

</head>

<body>

<div id="game-container"></div>

<script>

// Tamanho do jogo
const larguraJogo = 700;
const alturaJogo = 850; 

// =============================
// Variáveis globais
// =============================
let alien;
let fogo;
let plataforma;
let plataforma2;
let teclas;
let moedas;
let placar;
let pontuacao = 0;

let coracao = null;
let proximaMetaCoracao = 10;

let jogoFinalizado = false;


// =============================
// Configuração do jogo
// =============================
const config = {
    type: Phaser.AUTO,
    width: larguraJogo,
    height: alturaJogo,

    parent: 'game-container',

    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },

    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 300 },
            debug: false
        }
    },

    scene: {
        preload,
        create,
        update
    }
};

const game = new Phaser.Game(config);


// =============================
// PRELOAD
// =============================
function preload() {

    this.load.image('background', 'assets/bg.png');
    this.load.image('alien', 'assets/alienigena.png');
    this.load.image('fogo', 'assets/turbo.png');
    this.load.image('plataforma', 'assets/tijolos.png');
    this.load.image('moeda', 'assets/moeda.png');
    this.load.image('coracao', 'assets/coracao.png');

}


// =============================
// CREATE
// =============================
function create() {

    pontuacao = 0;
    proximaMetaCoracao = 10;
    jogoFinalizado = false;
    coracao = null;

    this.add.image(larguraJogo/2, alturaJogo/2, 'background');

    plataforma = this.physics.add.staticImage(larguraJogo/2, 650, 'plataforma');
    plataforma2 = this.physics.add.staticImage(larguraJogo/2, 300, 'plataforma');

    fogo = this.add.sprite(0, 0, 'fogo');
    fogo.setVisible(false);

    alien = this.physics.add.sprite(larguraJogo/2, 100, 'alien');
    alien.setCollideWorldBounds(true);

    this.physics.add.collider(alien, plataforma);
    this.physics.add.collider(alien, plataforma2);

    teclas = this.input.keyboard.createCursorKeys();

    moedas = this.physics.add.group();

    for (let i = 0; i < 3; i++) {

        let moeda = moedas.create(
            Phaser.Math.Between(100, 600),
            Phaser.Math.Between(100, 400),
            'moeda'
        );

        moeda.setBounce(0.7);
        moeda.setCollideWorldBounds(true);

    }

    this.physics.add.collider(moedas, plataforma);
    this.physics.add.collider(moedas, plataforma2);

    this.physics.add.overlap(alien, moedas, coletarMoeda, null, this);

    placar = this.add.text(50, 50, 'Moedas: 0', {
        fontSize: '45px',
        fill: '#495613'
    });

}


// =============================
// UPDATE
// =============================
function update() {

    if (jogoFinalizado) return;

    alien.setVelocityX(0);

    if (teclas.left.isDown) {
        alien.setVelocityX(-200);
    }
    else if (teclas.right.isDown) {
        alien.setVelocityX(200);
    }

    if (teclas.up.isDown) {
        alien.setVelocityY(-250);
        fogo.setVisible(true);
    } else {
        fogo.setVisible(false);
    }

    fogo.setPosition(alien.x, alien.y + alien.height/2);

}


// =============================
// COLETAR MOEDA
// =============================
function coletarMoeda(alienSprite, moeda) {

    moeda.disableBody(true, true);

    pontuacao += 1;
    placar.setText('Moedas: ' + pontuacao);

    moeda.enableBody(
        true,
        Phaser.Math.Between(50, larguraJogo - 50),
        100,
        true,
        true
    );

    verificarCoracao();
    verificarVitoria();

}


// =============================
// CORAÇÃO BONUS
// =============================
function verificarCoracao() {

    if (pontuacao >= proximaMetaCoracao && !coracao) {

        const scene = game.scene.scenes[0];

        coracao = scene.physics.add.sprite(
            Phaser.Math.Between(100, larguraJogo - 100),
            Phaser.Math.Between(150, 400),
            'coracao'
        );

        coracao.body.setAllowGravity(false);
        coracao.setCollideWorldBounds(true);

        scene.physics.add.overlap(alien, coracao, () => {

            pontuacao += 5;
            placar.setText('Moedas: ' + pontuacao);

            coracao.destroy();
            coracao = null;

        });

        proximaMetaCoracao += 10;

    }

}


// =============================
// VITÓRIA
// =============================
function verificarVitoria() {

    if (pontuacao >= 50 && !jogoFinalizado) {

        const scene = game.scene.scenes[0];

        jogoFinalizado = true;
        scene.physics.pause();

        scene.add.text(larguraJogo/2, alturaJogo/2 - 50, 'WIN!', {
            fontSize: '80px',
            fill: '#ffffff'
        }).setOrigin(0.5);

        let botao = scene.add.text(larguraJogo/2, alturaJogo/2 + 40, 'Recomeçar', {
            fontSize: '40px',
            fill: '#00ff00'
        })
        .setOrigin(0.5)
        .setInteractive();

        botao.on('pointerdown', () => {
            scene.scene.restart();
        });

    }

}

</script>

</body>
</html>
